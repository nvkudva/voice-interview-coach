[project]
name = "voice-interview-coach"
version = "0.1.0"
description = "Real-time LiveKit voice agent: a technical interview coach."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents==1.8.0",
    "livekit-plugins-anthropic==1.8.0",
    "livekit-plugins-cartesia==1.8.0",
    "livekit-plugins-deepgram==1.8.0",
    "livekit-plugins-elevenlabs==1.8.0",
    "livekit-plugins-silero==1.8.0",
    "livekit-api>=1.2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Avatar providers are opt-in: install only the one AVATAR_MODEL names.
# lemonslice needs nothing extra — it is served by the LiveKit gateway.
tavus = ["livekit-plugins-tavus==1.8.0"]
bey = ["livekit-plugins-bey==1.8.0"]
simli = ["livekit-plugins-simli==1.8.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
